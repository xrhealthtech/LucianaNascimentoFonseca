<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Ícones para Atalho na Tela Inicial -->
  <link rel="icon" href="ABNI_Logo.png" type="image/png">
  <link rel="apple-touch-icon" href="ABNI_Logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dra. Luciana Nascimento Fonseca | Cartão Virtual</title>
  <style>
    :root {
      --bg-color: #021a08;
      --card-bg: #ad2e39;
      --accent: #f9bc16;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Cartão Estilizado */
    .business-card {
      background: linear-gradient(135deg, #c91a14 0%, #5a0303 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .logo-symbol {
      width: 68px;
      height: auto;
      margin-bottom: 20px;
    }

    .name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .title {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Botões de Ação */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.1s ease, opacity 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Botão Principal: Download VCF */
    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }

    /* Botões Secundários */
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.14);
    }

    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .tip-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: #ffedd5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
    }

  .tip-box svg {
    color: var(--accent);
   flex-shrink: 0;
  }

  .tip-box strong {
    color: #ffffff;
  }

  </style>
</head>
<body>

  <div class="container">
    <!-- Visualização do Cartão -->
    <div class="business-card" id="card">
      <img class="logo-symbol" src="ABNI_Logo.png" alt="Símbolo Biomecânica" onerror="this.style.display='none'">
      <h1 class="name">Dra. Luciana Nascimento Fonseca</h1>
      <p class="title">Fisioterapeuta Pélvica</p>
    </div>

<!-- Links e Ações -->
    <div class="actions">
      <!-- Gera o contato direto na agenda -->
      <button class="btn btn-primary" onclick="generateVCard()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7.5" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        Salvar na Agenda
      </button>

      <!-- Mensagem direta -->
      <a class="btn btn-secondary" href="https://wa.me/5538991670013" target="_blank" rel="noopener">
        Conversar no WhatsApp
      </a>

      <!-- Landing Page / Serviços -->
      <a class="btn btn-secondary" href="CardapioLucianaNF.html">
        Serviços
      </a>

      <!-- Instagram -->
      <a class="btn btn-secondary" href="" target="_blank" rel="noopener">
        Siga no Instagram
      </a>
      
      <!-- Sobre / Lattes -->
      <a class="btn btn-secondary" href="sobreLuciana.html" target="_blank" rel="noopener">
        Sobre a Dra. Luciana
      </a>

      <!-- Botão Compartilhar -->
        <button class="btn btn-secondary" id="btn-compartilhar">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          Compartilhar Cartão
        </button>  
    </div>

    <!-- Dica de instrução -->
    <div class="tip-box">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>Toque em <strong>"Salvar na Agenda"</strong> para baixar o contato.</span>
    </div>
  </div>

  <script>
    function generateVCard() {
      const contactData = {
        name: "Dra. Luciana Nascimento Fonseca",
        firstName: "Luciana",
        lastName: "Nascimento Fonseca",
        org: "Fisioterapia Pélvica",
        title: "Fisioterapia Pélvica",
        phone: "+5538991670013",
        email: "",
        url: "https://xrhealthtech.github.io/CartaoVisitaConsult/"
      };

      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${contactData.lastName};${contactData.firstName};;;`,
        `FN:${contactData.name}`,
        `ORG:${contactData.org}`,
        `TITLE:${contactData.title}`,
        `TEL;TYPE=CELL,VOICE:${contactData.phone}`,
        `EMAIL;TYPE=WORK,INTERNET:${contactData.email}`,
        `URL:${contactData.url}`,
        `NOTE:Acesse o catálogo de serviços: ${contactData.url}`,
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `${contactData.firstName}_Contato.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Lógica para o botão de Compartilhar Nativo
    const btnCompartilhar = document.getElementById('btn-compartilhar');
    btnCompartilhar.addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Dr. Tulio Brandão Xavier-Rocha | Cartão Virtual',
            text: 'Conheça meu cartão de visitas digital e consultoria em biomecânica:',
            url: window.location.href
          });
        } catch (err) {
          console.log('Compartilhamento cancelado ou com erro:', err);
        }
      } else {
        // Fallback para computadores ou navegadores que não suportam
        navigator.clipboard.writeText(window.location.href);
        alert('Link copiado para a área de transferência!');
      }
    });
  </script>
</body>
</html>
